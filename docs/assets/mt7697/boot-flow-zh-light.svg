<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>MT7697 bootloader 開機與記憶體流向</title><desc>左欄是 SPI flash（XIP 0x10000000）的分區，右欄是 SYSRAM（0x20000000）。① Boot ROM 讀 flash 開頭的向量表，MSP 設為 0x20008E48、PC 設為 0x10000081，也就是 flash 上的 ResetISR。② ResetISR 在 flash 上執行，把 bootloader 的 .text 與 .data 複製到 SYSRAM 0x20000000，清 BSS 後長跳到 SYSRAM 裡的 main。③ main 把 VTOR 指到 SYSRAM 的向量表、打開 fault、檢查 FOTA。④ jump_to 把 MSP 設為 0x20040000，bx 到 0x10079001，也就是 app 在 flash 上的 Reset_Handler。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="60" width="280" height="400" rx="10" fill="#F1EFE8" fill-opacity="0.35" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="4 3"/>
<rect x="490" y="60" width="280" height="400" rx="10" fill="#F1EFE8" fill-opacity="0.35" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="4 3"/>
<rect x="310" y="6" width="180" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="400.0" y="19.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Boot ROM（閉源）</text><text x="400.0" y="37.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">① 讀 flash 開頭的 [0]、[1]</text>
<rect x="45" y="72" width="250" height="92" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="170.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Bootloader 32KB</text><text x="170.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">0x10000000 向量表</text><text x="170.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">0x10000080 ResetISR</text><text x="170.0" y="145.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">MSP=0x20008E48 PC=0x10000081</text>
<rect x="45" y="172" width="250" height="30" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="170.0" y="187.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Reserved 32KB</text>
<rect x="45" y="210" width="250" height="40" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="170.0" y="230.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">N9 Wi-Fi 韌體 420KB　0x10010000</text>
<rect x="45" y="258" width="250" height="84" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="170.0" y="282.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Arduino app 1972KB</text><text x="170.0" y="300.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">0x10079000 Reset_Handler</text><text x="170.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">（.init 段，第一個位元組就是程式）</text>
<rect x="45" y="350" width="250" height="40" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="170.0" y="370.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">FOTA 暫存 1576KB　0x10266000</text>
<rect x="45" y="398" width="250" height="30" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/><text x="170.0" y="413.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">NVDM 64KB　0x103F0000</text>
<rect x="505" y="72" width="250" height="92" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="630.0" y="91.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Bootloader（搬移後）</text><text x="630.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">0x20000000 向量表（VTOR）</text><text x="630.0" y="127.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">0x20000C7C main()</text><text x="630.0" y="145.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">③ VTOR、SHCSR、FOTA</text>
<rect x="505" y="172" width="250" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="630.0" y="185.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">.bss + KernelStack 8KB</text><text x="630.0" y="203.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">棧頂 0x20008E48</text>
<rect x="505" y="398" width="250" height="30" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="630.0" y="413.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">app 棧頂 0x20040000（SYSRAM 尾端）</text>
<path d="M310 28 L170 28 L170 70" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M295 110 L503 110" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="400" y="98" text-anchor="middle" font-size="12" fill="#3D3D3A">② ResetISR 複製</text>
<text x="400" y="128" text-anchor="middle" font-size="12" fill="#5F5E5A">.text + .data</text>
<path d="M505 150 L400 150 L400 300 L297 300" fill="none" stroke="#73726C" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="400" y="322" text-anchor="middle" font-size="12" fill="#3D3D3A">④ jump_to</text>
<text x="400" y="340" text-anchor="middle" font-size="12" fill="#5F5E5A">MSP=0x20040000</text>
<text x="400" y="356" text-anchor="middle" font-size="12" fill="#5F5E5A">bx 0x10079001</text>
<text x="170" y="482" text-anchor="middle" font-size="14" font-weight="500" fill="#3D3D3A">SPI flash（XIP 0x1000_0000）</text>
<text x="630" y="482" text-anchor="middle" font-size="14" font-weight="500" fill="#3D3D3A">SYSRAM 256KB（0x2000_0000）</text>
</svg>
