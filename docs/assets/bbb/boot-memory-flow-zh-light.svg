<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="680" height="444" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>開機每一段跑在哪、把誰搬去哪</title><desc>三條直欄是三個地方：內部 SRAM、DRAM、SD 卡或網路。五個步驟由上而下：Boot ROM 把 MLO 從 SD 複製進 SRAM；SPL 在 SRAM 裡初始化 DDR，再把 u-boot.img 搬進 DRAM；U-Boot 在 DRAM 裡把自己搬到頂端；U-Boot 把 zImage、DTB、initrd 放進 DRAM，bootz 再搬一次；zImage 在 DRAM 裡把 kernel 解壓到 0x80008000。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="150" y="12" width="130" height="418" rx="10" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="162" y="28" fill="#633806" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="central">內部 SRAM</text>
<text x="162" y="45" fill="#854F0B" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">晶片內，約 109 KB</text>
<rect x="288" y="12" width="230" height="418" rx="10" fill="#EEEDFE" fill-opacity="0.45" stroke="#534AB7" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="300" y="28" fill="#3C3489" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="central">DRAM（外部 DDR3）</text>
<text x="300" y="45" fill="#534AB7" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">0x80000000 起，512 MiB</text>
<rect x="526" y="12" width="134" height="418" rx="10" fill="#F1EFE8" fill-opacity="0.45" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="538" y="28" fill="#444441" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="central">SD 卡 / 網路</text>
<text x="538" y="45" fill="#5F5E5A" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">還沒進記憶體</text>
<text x="20" y="85.0" fill="#444441" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">① Boot ROM</text>
<text x="20" y="104.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">跑在晶片內 ROM</text>
<rect x="158" y="66" width="114" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="215.0" y="85.0" fill="#633806" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">SPL</text>
<text x="215.0" y="104.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">0x402F0400</text>
<rect x="534" y="66" width="118" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="593.0" y="85.0" fill="#444441" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">MLO</text>
<text x="593.0" y="104.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">FAT 分割區</text>
<line x1="532" y1="94.0" x2="274" y2="94.0" stroke="#73726C" stroke-width="1" marker-end="url(#arrow)"/>
<text x="403.0" y="82.0" fill="#5F5E5A" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">ROM 複製（DDR 還不能用）</text>
<text x="20" y="155.0" fill="#444441" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">② SPL</text>
<text x="20" y="174.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">跑在 SRAM</text>
<rect x="158" y="136" width="114" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="215.0" y="155.0" fill="#633806" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">SPL 執行中</text>
<text x="215.0" y="174.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">初始化 DDR</text>
<rect x="296" y="136" width="214" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="403.0" y="155.0" fill="#3C3489" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">u-boot.img</text>
<text x="403.0" y="174.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">0x80800000</text>
<rect x="534" y="136" width="118" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="593.0" y="155.0" fill="#444441" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">u-boot.img</text>
<text x="593.0" y="174.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">FAT 分割區</text>
<line x1="532" y1="164.0" x2="512" y2="164.0" stroke="#73726C" stroke-width="1" marker-end="url(#arrow)"/>
<text x="20" y="225.0" fill="#444441" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">③ U-Boot</text>
<text x="20" y="244.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">跑在 DRAM</text>
<rect x="296" y="206" width="214" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="403.0" y="225.0" fill="#3C3489" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">U-Boot 搬自己到頂端</text>
<text x="403.0" y="244.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">0x80800000 → 0x9FF59000</text>
<text x="20" y="304.0" fill="#444441" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">④ load + bootz</text>
<text x="20" y="323.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">U-Boot 執行</text>
<rect x="296" y="276" width="214" height="74" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="403.0" y="295.0" fill="#3C3489" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">zImage / DTB / initrd</text>
<text x="403.0" y="314.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">load 放到 0x82000000 起</text>
<text x="403.0" y="331.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">bootz 再搬到 0x8F5D2000</text>
<rect x="534" y="276" width="118" height="74" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="593.0" y="304.0" fill="#444441" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">3 個檔</text>
<text x="593.0" y="323.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">ext4 或 TFTP</text>
<line x1="532" y1="313.0" x2="512" y2="313.0" stroke="#73726C" stroke-width="1" marker-end="url(#arrow)"/>
<text x="20" y="383.0" fill="#444441" font-size="13" font-weight="500" text-anchor="start" dominant-baseline="central">⑤ zImage</text>
<text x="20" y="402.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">解壓程式跑在 DRAM</text>
<rect x="296" y="364" width="214" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="403.0" y="383.0" fill="#3C3489" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">kernel 解壓</text>
<text x="403.0" y="402.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">0x82000000 → 0x80008000</text>
</svg>
