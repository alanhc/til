<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 658" width="680" height="658" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>AM335x 開機時的完整記憶體地圖</title><desc>由高位址到低位址：DRAM 裡的 U-Boot 本體、bootz 搬移後的 DTB 與 initrd、load 放的 DTB 與 initrd、zImage、SPL 的 BSS、重定位前的 U-Boot、kernel 解壓位置；中間隔著周邊暫存器區；最下面是晶片內 SRAM 的 MLO 與 Boot ROM。圓圈數字對應開機步驟。不按比例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="184" y="26" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0xA0000000</text>
<text x="200" y="26" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">DRAM 頂端（512 MiB）</text>
<rect x="200" y="44" width="420" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="410.0" y="63.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">③ U-Boot 本體（重定位後）</text>
<text x="410.0" y="82.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">下方接 malloc、gd、stack</text>
<text x="184" y="72.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x9FF59000</text>
<rect x="200" y="110" width="420" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="410.0" y="129.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">④ DTB + initrd（bootz 搬過來）</text>
<text x="410.0" y="148.0" fill="#0F6E56" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">bootm_size 限制在 0x90000000 以下</text>
<text x="184" y="138.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x8F5D2000</text>
<rect x="200" y="176" width="420" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="410.0" y="198.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">④ DTB、initrd（fdtaddr / rdaddr）</text>
<text x="184" y="198.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x88000000</text>
<rect x="200" y="230" width="420" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="410.0" y="252.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">④ zImage（loadaddr）</text>
<text x="184" y="252.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x82000000</text>
<rect x="200" y="284" width="420" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="410.0" y="303.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">② SPL 的 BSS 與 malloc</text>
<text x="410.0" y="322.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">DDR 一起來就移出 SRAM</text>
<text x="184" y="312.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80A00000</text>
<rect x="200" y="350" width="420" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="410.0" y="372.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">② u-boot.img（重定位前）</text>
<text x="184" y="372.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80800000</text>
<rect x="200" y="404" width="420" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="410.0" y="426.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">⑤ kernel 解壓到這裡</text>
<text x="184" y="426.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80008000</text>
<line x1="40" y1="462" x2="640" y2="462" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="340.0" y="478" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">0x80000000 DRAM 起點 ／ 下面隔著周邊暫存器：EMIF、UART0、GPIO1…</text>
<line x1="40" y1="490" x2="640" y2="490" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="200" y="504" width="420" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="410.0" y="523.0" fill="#633806" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">① MLO / SPL（內部 SRAM）</text>
<text x="410.0" y="542.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">ROM 的下載區到 0x4030B800</text>
<text x="184" y="532.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x402F0400</text>
<rect x="200" y="570" width="420" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="410.0" y="592.0" fill="#633806" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Boot ROM（public ROM，唯讀）</text>
<text x="184" y="592.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x40020000</text>
<rect x="200" y="629" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="222" y="636" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">load / 搬進來的位置</text>
<rect x="360" y="629" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="382" y="636" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">之後被搬去的位置</text>
<rect x="510" y="629" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="532" y="636" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">晶片內 ROM / SRAM</text>
</svg>
