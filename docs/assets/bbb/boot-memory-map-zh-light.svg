<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 834" width="680" height="834" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>AM335x 開機時的完整記憶體地圖</title><desc>由高位址到低位址分成三個區域。DRAM（外部 DDR3）：U-Boot 本體、bootz 搬移後的 DTB 與 initrd、load 放的 DTB 與 initrd、zImage、SPL 的 BSS、重定位前的 U-Boot、kernel 解壓位置。中間是周邊暫存器，不是記憶體。晶片內 SRAM：MLO／SPL。晶片內 ROM：Boot ROM。圓圈數字對應開機步驟。不按比例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="16" width="640" height="508" rx="10" fill="#EEEDFE" fill-opacity="0.45" stroke="#534AB7" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="32" y="32" fill="#3C3489" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="central">DRAM（外部 DDR3，512 MiB）</text>
<text x="32" y="49" fill="#534AB7" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">DDR 要等 SPL 初始化後才能用</text>
<rect x="20" y="558" width="640" height="110" rx="10" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="32" y="574" fill="#633806" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="central">內部 SRAM（晶片內）</text>
<text x="32" y="591" fill="#854F0B" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">上電就能用，Boot ROM 只能把東西放這裡</text>
<rect x="20" y="684" width="640" height="110" rx="10" fill="#F1EFE8" fill-opacity="0.45" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="32" y="700" fill="#444441" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="central">Boot ROM（晶片內，唯讀）</text>
<text x="32" y="717" fill="#5F5E5A" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central">上電後 CPU 從這裡開始執行</text>
<text x="184" y="69.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0xA0000000</text>
<text x="200" y="69.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">DRAM 頂端</text>
<rect x="200" y="82" width="420" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="410.0" y="101.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">③ U-Boot 本體（重定位後）</text>
<text x="410.0" y="120.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">下方接 malloc、gd、stack</text>
<text x="184" y="110.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x9FF59000</text>
<rect x="200" y="148" width="420" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="410.0" y="167.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">④ DTB + initrd（bootz 搬過來）</text>
<text x="410.0" y="186.0" fill="#0F6E56" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">bootm_size 限制在 0x90000000 以下</text>
<text x="184" y="176.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x8F5D2000</text>
<rect x="200" y="214" width="420" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="410.0" y="236.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">④ DTB、initrd（fdtaddr / rdaddr）</text>
<text x="184" y="236.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x88000000</text>
<rect x="200" y="268" width="420" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="410.0" y="290.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">④ zImage（loadaddr）</text>
<text x="184" y="290.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x82000000</text>
<rect x="200" y="322" width="420" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="410.0" y="341.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">② SPL 的 BSS 與 malloc</text>
<text x="410.0" y="360.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">DDR 一起來就移出 SRAM</text>
<text x="184" y="350.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80A00000</text>
<rect x="200" y="388" width="420" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="410.0" y="410.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">② u-boot.img（重定位前）</text>
<text x="184" y="410.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80800000</text>
<rect x="200" y="442" width="420" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="410.0" y="464.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">⑤ kernel 解壓到這裡</text>
<text x="184" y="464.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80008000</text>
<text x="184" y="505.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80000000</text>
<text x="200" y="505.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">DRAM 起點</text>
<text x="340.0" y="540.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">周邊暫存器（MMIO，不是記憶體）：EMIF、UART0、GPIO1…</text>
<rect x="200" y="602" width="420" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="410.0" y="621.0" fill="#633806" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">① MLO / SPL</text>
<text x="410.0" y="640.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">ROM 的下載區到 0x4030B800，約 109 KB</text>
<text x="184" y="630.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x402F0400</text>
<rect x="200" y="728" width="420" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="410.0" y="747.0" fill="#633806" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Boot ROM 程式</text>
<text x="410.0" y="766.0" fill="#854F0B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">出廠就燒死</text>
<text x="184" y="756.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x40020000</text>
<rect x="40" y="805" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="62" y="812" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">load / 搬進來的位置</text>
<rect x="250" y="805" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="272" y="812" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">之後被搬去的位置</text>
<rect x="450" y="805" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="472" y="812" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">U-Boot 自己用的</text>
</svg>
