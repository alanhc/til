<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>BeagleBone Black boot chain and where the pitfalls landed</title><desc>Five stages top to bottom: Boot ROM, SPL, U-Boot, Linux kernel, systemd and userspace, each annotated with what to check or what went wrong.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="180.0" y="59.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Boot ROM</text>
<text x="180.0" y="78.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">On-chip; reads SYSBOOT, finds MLO</text>
<line x1="320" y1="68" x2="378" y2="68" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="46" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="510.0" y="68.0" fill="#444441" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">Holding S2 changes boot order</text>
<rect x="40" y="126" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="180.0" y="145.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">SPL (MLO)</text>
<text x="180.0" y="164.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Runs in SRAM, sets up DDR</text>
<line x1="320" y1="154" x2="378" y2="154" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="132" width="260" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="510.0" y="154.0" fill="#633806" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">Log lost to USB hub re-enumeration</text>
<line x1="180" y1="98" x2="180" y2="124" stroke="#73726C" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="212" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="180.0" y="231.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">U-Boot</text>
<text x="180.0" y="250.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">env, bootcmd, tftp, bootz</text>
<line x1="320" y1="240" x2="378" y2="240" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="218" width="260" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="510.0" y="240.0" fill="#633806" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">bootdelay=0: must spam spaces</text>
<line x1="180" y1="184" x2="180" y2="210" stroke="#73726C" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="298" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="180.0" y="317.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Linux kernel</text>
<text x="180.0" y="336.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Decompress, read DTB, probe</text>
<line x1="320" y1="326" x2="378" y2="326" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="304" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="510.0" y="326.0" fill="#444441" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">Check Linux version and cmdline</text>
<line x1="180" y1="270" x2="180" y2="296" stroke="#73726C" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="384" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="180.0" y="403.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">systemd and userspace</text>
<text x="180.0" y="422.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Mount rootfs, network, login</text>
<line x1="320" y1="412" x2="378" y2="412" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="390" width="260" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="510.0" y="412.0" fill="#633806" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">No net.ifnames=0: NIC is end0</text>
<line x1="180" y1="356" x2="180" y2="382" stroke="#73726C" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="457" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="62" y="464" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Pitfalls hit this time</text>
<rect x="250" y="457" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="272" y="464" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">What to check</text>
</svg>
