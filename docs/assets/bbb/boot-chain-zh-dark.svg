<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>BeagleBone Black 開機鏈與這次踩到的坑</title><desc>由上而下五層：Boot ROM、SPL、U-Boot、Linux kernel、systemd 與 userspace，每層右側是觀察點或這次遇到的問題。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9C9A92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="280" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="180.0" y="59.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Boot ROM</text>
<text x="180.0" y="78.0" fill="#CECBF6" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">晶片內建，讀 SYSBOOT 找 MLO</text>
<line x1="320" y1="68" x2="378" y2="68" stroke="#9C9A92" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="46" width="260" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="510.0" y="68.0" fill="#F1EFE8" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">按住 S2 會改變開機順序</text>
<rect x="40" y="126" width="280" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="180.0" y="145.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">SPL（MLO）</text>
<text x="180.0" y="164.0" fill="#CECBF6" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">在內部 SRAM 跑，初始化 DDR</text>
<line x1="320" y1="154" x2="378" y2="154" stroke="#9C9A92" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="132" width="260" height="44" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.75"/>
<text x="510.0" y="154.0" fill="#FAEEDA" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">log 被 USB hub 重新列舉吃掉</text>
<line x1="180" y1="98" x2="180" y2="124" stroke="#9C9A92" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="212" width="280" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="180.0" y="231.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">U-Boot</text>
<text x="180.0" y="250.0" fill="#CECBF6" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">env、bootcmd、tftp、bootz</text>
<line x1="320" y1="240" x2="378" y2="240" stroke="#9C9A92" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="218" width="260" height="44" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.75"/>
<text x="510.0" y="240.0" fill="#FAEEDA" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">bootdelay=0，要狂送空白才攔得住</text>
<line x1="180" y1="184" x2="180" y2="210" stroke="#9C9A92" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="298" width="280" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="180.0" y="317.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Linux kernel</text>
<text x="180.0" y="336.0" fill="#CECBF6" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">解壓、讀 DTB、probe 驅動</text>
<line x1="320" y1="326" x2="378" y2="326" stroke="#9C9A92" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="304" width="260" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="510.0" y="326.0" fill="#F1EFE8" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">驗 Linux version 與 cmdline</text>
<line x1="180" y1="270" x2="180" y2="296" stroke="#9C9A92" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="384" width="280" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="180.0" y="403.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">systemd 與 userspace</text>
<text x="180.0" y="422.0" fill="#CECBF6" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">掛 rootfs、起網路、login</text>
<line x1="320" y1="412" x2="378" y2="412" stroke="#9C9A92" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="380" y="390" width="260" height="44" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.75"/>
<text x="510.0" y="412.0" fill="#FAEEDA" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">少了 net.ifnames=0，網卡變 end0</text>
<line x1="180" y1="356" x2="180" y2="382" stroke="#9C9A92" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="457" width="14" height="14" rx="3" fill="#633806" stroke="#EF9F27" stroke-width="0.75"/>
<text x="62" y="464" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">這次實際踩到的坑</text>
<rect x="250" y="457" width="14" height="14" rx="3" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="272" y="464" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">觀察點與驗證方式</text>
</svg>
