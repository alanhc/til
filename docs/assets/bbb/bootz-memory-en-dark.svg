<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 426" width="680" height="426" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>DRAM layout around bootz</title><desc>512 MiB of DRAM from 0x80000000 to 0xA0000000; top to bottom: U-Boot itself, DTB and initrd moved by bootz, initrd, DTB, zImage, and where the kernel decompresses. Not to scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9C9A92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="184" y="26" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0xA0000000</text>
<text x="200" y="26" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Top of DRAM (512 MiB)</text>
<rect x="200" y="44" width="320" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="360.0" y="66.0" fill="#F1EFE8" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">U-Boot itself (relocated)</text>
<text x="184" y="66.0" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x9FF59000</text>
<rect x="200" y="98" width="320" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
<text x="360.0" y="117.0" fill="#E1F5EE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">DTB + initrd (moved by bootz)</text>
<text x="360.0" y="136.0" fill="#9FE1CB" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">What the kernel gets; r2 = DTB</text>
<text x="184" y="126.0" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x8F5D2000</text>
<rect x="200" y="164" width="320" height="44" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="360.0" y="186.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">initrd (rdaddr, 10.5 MB)</text>
<text x="184" y="186.0" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x88080000</text>
<rect x="200" y="218" width="320" height="44" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="360.0" y="240.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">DTB (fdtaddr, ~99 KB)</text>
<text x="184" y="240.0" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x88000000</text>
<rect x="200" y="272" width="320" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="360.0" y="291.0" fill="#EEEDFE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">zImage (loadaddr, 5.7 MB)</text>
<text x="360.0" y="310.0" fill="#CECBF6" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">offset 0x24 = 016f2818</text>
<text x="184" y="300.0" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x82000000</text>
<rect x="200" y="338" width="320" height="44" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
<text x="360.0" y="360.0" fill="#E1F5EE" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Kernel decompresses here</text>
<text x="184" y="360.0" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80008000</text>
<rect x="200" y="397" width="14" height="14" rx="3" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
<text x="222" y="404" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Where tftp / load puts it</text>
<rect x="400" y="397" width="14" height="14" rx="3" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
<text x="422" y="404" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">Where it gets moved (not to scale)</text>
</svg>
