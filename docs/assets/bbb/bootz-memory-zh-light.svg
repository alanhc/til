<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 426" width="680" height="426" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
<title>bootz 前後的 DRAM 配置</title><desc>512 MiB DRAM 從 0x80000000 到 0xA0000000，由上而下為 U-Boot 本體、bootz 搬移後的 DTB 與 initrd、initrd、DTB、zImage、kernel 解壓位置。不按比例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="184" y="26" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0xA0000000</text>
<text x="200" y="26" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">DRAM 頂端（512 MiB）</text>
<rect x="200" y="44" width="320" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="360.0" y="66.0" fill="#444441" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">U-Boot 本體（relocate 後）</text>
<text x="184" y="66.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x9FF59000</text>
<rect x="200" y="98" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="360.0" y="117.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">DTB + initrd（bootz 搬過來）</text>
<text x="360.0" y="136.0" fill="#0F6E56" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">交給 kernel 的是這裡，r2 = DTB</text>
<text x="184" y="126.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x8F5D2000</text>
<rect x="200" y="164" width="320" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="360.0" y="186.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">initrd（rdaddr，10.5 MB）</text>
<text x="184" y="186.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x88080000</text>
<rect x="200" y="218" width="320" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="360.0" y="240.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">DTB（fdtaddr，約 99 KB）</text>
<text x="184" y="240.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x88000000</text>
<rect x="200" y="272" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="360.0" y="291.0" fill="#3C3489" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">zImage（loadaddr，5.7 MB）</text>
<text x="360.0" y="310.0" fill="#534AB7" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">offset 0x24 = 016f2818</text>
<text x="184" y="300.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x82000000</text>
<rect x="200" y="338" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="360.0" y="360.0" fill="#085041" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">kernel 解壓到這裡</text>
<text x="184" y="360.0" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="central">0x80008000</text>
<rect x="200" y="397" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="222" y="404" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">tftp / load 放的位置</text>
<rect x="400" y="397" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="422" y="404" fill="#5F5E5A" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">之後被搬去的位置（不按比例）</text>
</svg>
