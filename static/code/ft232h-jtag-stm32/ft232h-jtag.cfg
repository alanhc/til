# FT232H (Adafruit breakout) as a 4-wire JTAG probe
# D0=TCK D1=TDI D2=TDO D3=TMS  (I2C switch OFF)
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
# value: TMS high, others low ; direction: TCK/TDI/TMS out, TDO in
ftdi layout_init 0x0008 0x000b
adapter speed 1000
transport select jtag
